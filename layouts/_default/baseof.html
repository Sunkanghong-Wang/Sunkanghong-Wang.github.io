{{- if lt hugo.Version "0.147.2" }}
{{- errorf "=> hugo v0.147.2 or greater is required for hugo-PaperMod to build " }}
{{- end -}}

<!DOCTYPE html>
<html lang="{{ site.Language }}" dir="{{ .Language.LanguageDirection | default "auto" }}">

<head>
    {{- partial "head.html" . }}
</head>

<body class="
{{- if (or (ne .Kind `page` ) (eq .Layout `archives`) (eq .Layout `search`) (eq .Layout `about`)) -}}
{{- print "list" -}}
{{- end -}}
{{- if eq site.Params.defaultTheme `dark` -}}
{{- print " dark" -}}
{{- end -}}
{{- if not .IsHome -}}
{{- print " body-pub" -}}
{{- end -}}
{{- if or (and (eq .Section "publications") (eq .Kind "section")) (and (eq .Section "tags") (eq .Kind "term")) -}}
{{- print " pub-section-list" -}}
{{- end -}}
" id="top">
    {{- partial "header.html" . -}}
    <main class="main">
        {{- block "main" . }}{{ end }}
    </main>
    {{- partial "footer.html" . -}}
</body>
</html>
