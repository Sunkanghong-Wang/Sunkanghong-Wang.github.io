params:
    # About-page headshot: place static/<avatarBaseName>.<jpg|jpeg|png|webp|gif> (only one extension).
    about:
        avatarBaseName: avatar
        avatarAlt: "Sunkanghong Wang"

    # Cache-buster for /cv.pdf when static/cvs/ has no WSKH-CV-yyyy-MM-dd.pdf yet (fallback link).
    cvPdfVersion: "20260428"
    description: "This website hosts Sunkanghong Wang's research papers, course materials, data, curriculum vitae, and contact information."
    author: Sunkanghong Wang
    # googleAnalyticsID: "G-XXXXX"
    DateFormat: "January 2006"
    defaultTheme: light
    hideFooter: false
    disableThemeToggle: true
    ShowShareButtons: false
    ShowReadingTime: false
    disableSpecial1stPost: true
    disableAnchoredHeadings: true
    ShowPostNavLinks: false
    ShowBreadCrumbs: false
    ShowCodeCopyButtons: true
    ShowAllPagesInArchive: false
    MainSections: ["publications"]
    ShowToc: false
    disableScrollToTop: true
    TocOpen: true
    ShowWordCount: false
    UseHugoToc: true
    comments: false
    math: true
    profileMode:
          enabled: false
          title: Sunkanghong Wang (王孙康宏)
          subtitle: "I am currently pursuing a master's degree in Mechanical Engineering at Guangdong University of Technology (GDUT), Guangzhou, Guangdong, China, with an expected graduation in June 2026. My research focuses on Operations Research, Discrete Optimization, Algorithm Design, and Packing & Cutting Problems. I am passionate about collaborating on challenging projects that intersect discrete optimization, algorithms, and practical applications."
          # If you enable profileMode: site-root URL for static headshot, e.g. /avatar.jpg (same basename/extension as static/).
          imageUrl: ""
          imageWidth: 160
          imageHeight: 160
          buttons:
            - name: About
              url: about/
            - name: Publications
              url: publications/

    socialIcons:
        - name: CV
          url: cv.pdf
        - name: Email
          url: mailto:wskh0929@gmail.com
        - name: Google Scholar
          url: https://scholar.google.com/citations?hl=en&user=G3XNZl8AAAAJ
        - name: GitHub
          url: https://github.com/WSKH0929

    assets:
        disableScrollBarStyle: true
    cover:
        hiddenInList: false
        hiddenInSingle: true
    label:
      text: "Sunkanghong Wang"
      icon: favicon.ico
      iconHeight: 18

    # Header page-view counter (hitwebcounter). Hover/focus shows tooltip copy below.
    pageViews:
        enabled: true
        icon: "👣"
        counterImgSrc: "https://hitwebcounter.com/counter/counter.php?page=21439720&style=0006&nbdigits=5&type=page&initCount=134"
        counterHref: "https://www.hitwebcounter.com/"
        tooltip: "Approximate site-wide visits: a baseline from my earlier Google Site plus counts since this site launched."

markup:
    goldmark:
        renderer:
            unsafe: true
        parser:
            wrapStandAloneImageWithinParagraph: false
            attribute:
                block: true
                title: true
        extensions:
            # Otherwise `"` inside `{width="70%"}` becomes curly quotes and image attributes won’t parse.
            typographer: false
    highlight:
        guessSyntax: true
        style: autumn 
    tableOfContents:
        endLevel: 2
        ordered: false
        startLevel: 2