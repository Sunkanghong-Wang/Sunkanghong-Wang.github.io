baseURL: "https://sunkanghong-wang.github.io"
title: Sunkanghong Wang
theme: PaperMod

# Drop stale HTML left over from removed content or prior template experiments (e.g. old demo pages).
cleanDestinationDir: true

# Hugo hides pages whose date is after “today” unless this is true (needed for dated Moments before that calendar day).
buildFuture: true

enableInlineShortcodes: true
enableRobotsTXT: true
pagination:
  pagerSize: 20

taxonomies:
    tag: tags

